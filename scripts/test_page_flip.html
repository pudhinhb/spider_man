<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test HTML PageFlip</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #book-container {
      width: 1040px;
      height: 735px;
      position: relative;
    }
    .my-page {
      width: 100%;
      height: 100%;
      background-color: #fff;
      overflow: hidden;
      position: relative;
    }
    .my-page img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }
  </style>
  <script src="/node_modules/page-flip/dist/js/page-flip.browser.js"></script>
</head>
<body>
  <div id="book-container">
    <div class="my-page"><img src="/brochure/page-1.png"></div>
    <div class="my-page"><img src="/brochure/page-2.png"></div>
    <div class="my-page"><img src="/brochure/page-3.png"></div>
    <div class="my-page"><img src="/brochure/page-4.png"></div>
    <div class="my-page"><img src="/brochure/page-5.png"></div>
    <div class="my-page"><img src="/brochure/page-6.png"></div>
  </div>

  <script>
    const container = document.getElementById('book-container');
    const pageFlip = new St.PageFlip(container, {
      width: 520,
      height: 735,
      size: "fixed",
      showCover: true,
      maxShadowOpacity: 0.6,
      drawShadow: true,
      flippingTime: 800,
      usePortrait: false,
    });

    pageFlip.loadFromHTML(document.querySelectorAll('.my-page'));

    pageFlip.on('init', () => {
      console.log('PageFlip HTML initialized!');
      for (let i = 0; i < pageFlip.getPageCount(); i++) {
        const p = pageFlip.getPage(i);
        if (p) p.setDensity('soft');
      }
    });

    window.pageFlip = pageFlip;

    window.testFoldCoverTop = () => {
      const rect = container.getBoundingClientRect();
      const flip = pageFlip.getFlipController();
      // Fold top-right corner of the cover downwards and to the left (around 780, 220)
      flip.fold({ x: rect.left + 780, y: rect.top + 220 });
    };
  </script>
</body>
</html>
